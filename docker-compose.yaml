services:
  api:
    build: .
    container_name: cookai_api
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: cookai_db
    environment:
      POSTGRES_USER: cookai
      POSTGRES_PASSWORD: cookai
      POSTGRES_DB: cookai
    ports:
      - "5432:5432"
    volumes:
      - cookai_db_data:/var/lib/postgresql/data

volumes:
  cookai_db_data:
